<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tankbeleg erfassen</title>
<!-- Tankbeleg-Erfassung (08.10.2026, Vorgabe Benedikt): Mitarbeitende fotografieren den Tankzettel, Vorname/Nachname Pflicht,
     v3 (08.10. abends): KILOMETERSTAND Pflicht, Vergleich mit dem letzten Beleg des Kennzeichens (km, Verbrauch je 100 km),
     Rueckfrage bei Unplausiblem (Funktion liefert `rueckfrage`, zweiter Klick bestaetigt), E-Autos: Menge in kWh.
     Kennzeichen, die Funktion "tankbeleg" liest Datum/Uhrzeit/Betrag, nach Pruefung wird gespeichert und die Datei
     im Eimer tankbelege unter <Kennzeichen>/<Jahr>/<Monat>/ abgelegt. Farben wie markt-todo.html. -->
<style>
  :root{--blue:#004f9e;--blue-dark:#00315f;--yellow:#ffdd00;--text:#08213f;--g:#2e7d32;--r:#c62828;--o:#b45309;--rand:#b8c7d9;--grau:#64748b}
  *{box-sizing:border-box}
  body{margin:0;font:16px/1.45 Arial,Helvetica,sans-serif;background:linear-gradient(180deg,var(--blue-dark),var(--blue));color:var(--text);min-height:100vh}
  /* Kopf wie markt-todo.html (08.10., Vorgabe Benedikt: "mit Logo und so, wie die App") */
  header{background:linear-gradient(135deg,#002b55,#0059ad);border-bottom:6px solid var(--yellow);padding:14px 12px 12px}
  .brand{max-width:560px;margin:0 auto}
  .logo{max-width:280px;width:100%;height:auto;display:block}
  .brand-title{font-size:30px;font-weight:900;font-style:italic;color:#fff}
  h1{margin:10px 0 0;font-size:20px;font-weight:900;font-style:italic;color:var(--yellow)}
  .sub{color:#d9ecff;font-size:13px;margin-top:3px}
  main{padding:14px 12px 40px;max-width:560px;margin:0 auto}
  .box{background:#fff;border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 8px 24px rgba(0,0,0,.14)}
  .box h2{margin:0 0 10px;font-size:17px;color:var(--blue-dark)}
  .box h2 .nr{display:inline-block;background:var(--yellow);color:var(--blue-dark);border-radius:50%;width:26px;height:26px;line-height:26px;text-align:center;font-size:13px;margin-right:6px}
  label{display:block;font-weight:bold;font-size:14px;margin:10px 0 4px}
  label small{font-weight:normal;color:var(--grau)}
  input,select{width:100%;font:inherit;padding:12px;border:1px solid var(--rand);border-radius:8px;background:#fff}
  input.fehlt{border-color:var(--r);background:#fdeeed}
  .zwei{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  button{font:inherit;font-weight:bold;padding:14px 16px;border:0;border-radius:8px;background:var(--yellow);color:var(--blue-dark);width:100%;cursor:pointer;margin-top:12px}
  button:disabled{background:#e9e2a4;color:#7a7452}
  button.zweit{background:#eef3f9;color:var(--blue-dark);border:1px solid var(--rand)}
  .foto{border:2px dashed var(--rand);border-radius:10px;padding:14px;text-align:center;cursor:pointer;position:relative;min-height:120px}
  .foto input{position:absolute;left:0;top:0;width:1px;height:1px;opacity:0}
  .foto img{max-width:100%;max-height:360px;border-radius:6px;display:none}
  .foto.hat img{display:block;margin:0 auto}.foto.hat .hint{display:none}
  .foto .hint{color:var(--grau);padding:28px 0}
  .foto .hint b{display:block;font-size:1.2rem;color:var(--blue-dark);margin-bottom:4px}
  .status{margin-top:10px;font-size:.92rem;color:var(--grau);white-space:pre-line}
  .status.fehler{color:var(--r);font-weight:bold}
  .hinweis{background:#fff7e6;border:1px solid var(--o);color:var(--o);border-radius:8px;padding:8px 10px;font-size:.9rem;margin-top:8px}
  .ok{background:#eef8f0;border:1px solid var(--g);color:var(--g);border-radius:8px;padding:10px;font-weight:bold}
  .ok small{display:block;font-weight:normal;color:var(--text);margin-top:4px}
  .rueckfrage{background:#fdeeed;border:2px solid var(--r);color:var(--r);border-radius:8px;padding:10px;font-size:.95rem;margin-top:10px}
  .rueckfrage b{display:block;margin-bottom:4px}
  .vorher{font-size:.85rem;color:var(--grau);margin-top:4px}
  .zwei .einheit{display:grid;grid-template-columns:1fr 84px;gap:6px}
  table{border-collapse:collapse;width:100%;font-size:.9rem;margin-top:8px}
  td,th{padding:6px 4px;border-bottom:1px solid #eee;text-align:left}
  th{font-size:.75rem;color:var(--grau);font-weight:600}
  td.z{text-align:right;white-space:nowrap}
  .versteckt{display:none}
</style>
</head>
<body>
<header>
  <div class="brand">
    <img src="logo.png" alt="EDEKA Paul Logo" class="logo" onerror="this.style.display='none';document.getElementById('fallbackBrand').style.display='block';">
    <div id="fallbackBrand" style="display:none"><div class="brand-title">Paul.</div></div>
    <h1>⛽ Tankbeleg erfassen</h1>
    <div class="sub">Tankzettel fotografieren, prüfen, fertig – der Beleg wird Ihrem Fahrzeug zugeordnet.</div>
  </div>
</header>
<main>

<div class="box" id="wer">
  <h2><span class="nr">1</span>Wer hat getankt?</h2>
  <div class="zwei">
    <div><label>Vorname <small>(Pflicht)</small></label><input id="vorname" type="text" autocomplete="given-name" placeholder="Vorname"></div>
    <div><label>Nachname <small>(Pflicht)</small></label><input id="nachname" type="text" autocomplete="family-name" placeholder="Nachname"></div>
  </div>
  <label>Kennzeichen <small>(Pflicht, z. B. SÜW-BM 247)</small></label>
  <input id="kennzeichen" type="text" list="kzliste" autocapitalize="characters" autocomplete="off" placeholder="SÜW-XX 123">
  <datalist id="kzliste"></datalist>
</div>

<div class="box" id="fotoBox">
  <h2><span class="nr">2</span>Tankzettel fotografieren</h2>
  <label class="foto" id="fotoFeld">
    <input id="datei" type="file" accept="image/*,application/pdf" capture="environment">
    <img id="vorschau" alt="">
    <div class="hint"><b>📷 Foto aufnehmen</b>oder Datei auswählen · ganzer Bon, gerade, gut beleuchtet</div>
  </label>
  <div class="status" id="status1"></div>
</div>

<div class="box versteckt" id="pruefen">
  <h2><span class="nr">3</span>Prüfen und speichern</h2>
  <div id="hinweise"></div>
  <label>Kilometerstand jetzt <small>(Pflicht – vom Tacho ablesen)</small></label>
  <input id="km" type="number" step="1" min="0" inputmode="numeric" placeholder="z. B. 45210">
  <div class="vorher" id="vorher"></div>
  <div class="zwei">
    <div><label>Datum</label><input id="datum" type="date"></div>
    <div><label>Uhrzeit</label><input id="uhrzeit" type="time"></div>
  </div>
  <div class="zwei">
    <div><label>Betrag brutto (€)</label><input id="betrag" type="number" step="0.01" min="0" inputmode="decimal" placeholder="0,00"></div>
    <div><label>Menge <small>(Liter, bei E-Auto kWh)</small></label><div class="einheit"><input id="liter" type="number" step="0.01" min="0" inputmode="decimal"><select id="einheit"><option value="l">l</option><option value="kWh">kWh</option></select></div></div>
  </div>
  <div class="zwei">
    <div><label>Kraftstoff <small>(optional)</small></label><input id="kraftstoff" type="text"></div>
    <div><label>Tankstelle <small>(optional)</small></label><input id="tankstelle" type="text"></div>
  </div>
  <div id="rueckfrage"></div>
  <button id="speichern">Beleg speichern</button>
  <div class="status" id="status2"></div>
</div>

<div class="box versteckt" id="fertig">
  <div class="ok" id="fertigText"></div>
  <button id="naechster">Nächsten Beleg erfassen</button>
</div>

<div class="box" id="meine">
  <h2>Meine letzten Belege</h2>
  <div id="liste" class="status">Vor- und Nachname eingeben, dann erscheinen hier die eigenen Belege.</div>
</div>

</main>
<script>
const SB_URL = "https://iexcjfyxujdxnwfcfdim.supabase.co";
const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlleGNqZnl4dWpkeG53ZmNmZGltIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzczMjc1NTIsImV4cCI6MjA5MjkwMzU1Mn0.EDMxLbiloqCAKRJA-gLUOiQiZmpagl1OeOpFjJtT5us";
const H = { "Authorization": "Bearer " + SB_KEY, "apikey": SB_KEY };
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const eur = n => n == null ? "" : Number(n).toFixed(2).replace(".", ",") + " €";
const deDatum = d => d ? d.slice(8, 10) + "." + d.slice(5, 7) + "." + d.slice(0, 4) : "";
let PFAD = null, GELESEN = null, LAEUFT = false, VORHER = null, RUECKFRAGE_OFFEN = false;
const km = n => n == null ? "" : Number(n).toLocaleString("de-DE") + " km";

async function funktion(body) {
  const r = await fetch(`${SB_URL}/functions/v1/tankbeleg`, { method: "POST", headers: { ...H, "Content-Type": "application/json" }, body: JSON.stringify(body) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok || j.fehler) throw new Error(j.fehler || ("Funktion " + r.status));
  return j;
}

// ---- Name + Kennzeichen merken (je Geraet) -------------------------------------------------------
for (const id of ["vorname", "nachname", "kennzeichen"]) {
  try { $(id).value = localStorage.getItem("tank_" + id) || ""; } catch (e) {}
  $(id).addEventListener("change", () => { try { localStorage.setItem("tank_" + id, $(id).value.trim()); } catch (e) {} $(id).classList.remove("fehlt"); if (id !== "kennzeichen") meineBelege(); });
}
$("kennzeichen").addEventListener("input", () => { $("kennzeichen").value = $("kennzeichen").value.toUpperCase(); });
funktion({ kennzeichen: true }).then(j => { $("kzliste").innerHTML = (j.kennzeichen || []).map(k => `<option value="${esc(k)}">`).join(""); }).catch(() => {});

function pflichtOk() {
  let ok = true;
  for (const id of ["vorname", "nachname", "kennzeichen"]) {
    const leer = $(id).value.trim().length < 2;
    $(id).classList.toggle("fehlt", leer); if (leer) ok = false;
  }
  if (!ok) { $("status1").textContent = "Bitte zuerst Vorname, Nachname und Kennzeichen eintragen."; $("status1").classList.add("fehler"); $("wer").scrollIntoView({ behavior: "smooth" }); }
  return ok;
}

// ---- Bild aufrecht drehen (EXIF) und auf 1800 px verkleinern - Bons sind schmal und lang, die Zahlen muessen scharf bleiben
async function bitmap(file) {
  try { return await createImageBitmap(file, { imageOrientation: "from-image" }); }
  catch (_) { return await new Promise((ok, nein) => { const im = new Image(); im.onload = () => ok(im); im.onerror = nein; im.src = URL.createObjectURL(file); }); }
}
async function verkleinern(file) {
  const bmp = await bitmap(file);
  const f = Math.min(1, 1800 / Math.max(bmp.width, bmp.height));
  const c = document.createElement("canvas"); c.width = Math.round(bmp.width * f); c.height = Math.round(bmp.height * f);
  c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
  return new Promise(ok => c.toBlob(ok, "image/jpeg", 0.88));
}

// ---- Schritt 2: Datei -> hochladen -> lesen -----------------------------------------------------
$("datei").onchange = async () => {
  const file = $("datei").files[0]; if (!file || LAEUFT) return;
  if (!pflichtOk()) { $("datei").value = ""; return; }
  LAEUFT = true; $("pruefen").classList.add("versteckt"); $("fertig").classList.add("versteckt");
  $("status1").classList.remove("fehler");
  try {
    const istPdf = file.type === "application/pdf" || /\.pdf$/i.test(file.name);
    let blob = file, ext = "pdf";
    if (!istPdf) {
      $("status1").textContent = "Bild wird vorbereitet …";
      blob = await verkleinern(file); ext = "jpg";
      $("vorschau").src = URL.createObjectURL(blob); $("fotoFeld").classList.add("hat");
    } else { $("vorschau").removeAttribute("src"); $("fotoFeld").classList.remove("hat"); }
    const id = (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));
    PFAD = `eingang/${id}.${ext}`;
    $("status1").textContent = "Wird hochgeladen …";
    const r = await fetch(`${SB_URL}/storage/v1/object/tankbelege/${PFAD}`, { method: "PUT", headers: { ...H, "Content-Type": istPdf ? "application/pdf" : "image/jpeg" }, body: blob });
    if (!r.ok) throw new Error("Hochladen fehlgeschlagen (" + r.status + ")");
    $("status1").textContent = "Beleg wird gelesen …";
    const j = await funktion({ lesen: true, pfad: PFAD, kennzeichen: $("kennzeichen").value.trim() });
    GELESEN = j.gelesen; VORHER = j.vorher || null; RUECKFRAGE_OFFEN = false; $("rueckfrage").innerHTML = ""; $("speichern").textContent = "Beleg speichern";
    $("datum").value = j.gelesen.datum || ""; $("uhrzeit").value = j.gelesen.uhrzeit || "";
    $("betrag").value = j.gelesen.betrag_brutto != null ? j.gelesen.betrag_brutto.toFixed(2) : "";
    $("liter").value = j.gelesen.liter != null ? j.gelesen.liter : ""; $("einheit").value = j.gelesen.einheit === "kWh" ? "kWh" : "l";
    $("kraftstoff").value = j.gelesen.kraftstoff || ""; $("tankstelle").value = j.gelesen.tankstelle || "";
    // Kilometerstand: Pflicht; vorbelegt nur, wenn er auf dem Bon gedruckt ist. Darunter der letzte Beleg des Fahrzeugs.
    $("km").value = j.gelesen.km_stand != null ? j.gelesen.km_stand : ""; $("km").classList.remove("fehlt");
    $("vorher").textContent = VORHER ? `Letzter Beleg für ${$("kennzeichen").value.trim()}: ${km(VORHER.km_stand)} am ${deDatum(VORHER.datum)}${VORHER.kraftstoff ? " (" + VORHER.kraftstoff + ")" : ""}` : "Erster Beleg für dieses Kennzeichen – ab dem nächsten wird der Verbrauch berechnet.";
    const hin = [...(j.hinweise || [])];
    if (j.gelesen.kennzeichen && j.gelesen.kennzeichen !== $("kennzeichen").value.trim().toUpperCase()) hin.push(`Auf dem Bon steht das Kennzeichen ${j.gelesen.kennzeichen} - oben steht ${$("kennzeichen").value.trim()}. Bitte prüfen.`);
    $("hinweise").innerHTML = hin.length ? `<div class="hinweis">${hin.map(esc).join("<br>")}</div>` : "";
    $("status1").textContent = `Gelesen in ${Math.round(j.dauer_ms / 1000)} s. Bitte Werte mit dem Zettel vergleichen.`;
    $("status2").textContent = ""; $("status2").classList.remove("fehler");
    $("pruefen").classList.remove("versteckt"); $("pruefen").scrollIntoView({ behavior: "smooth" });
  } catch (e) {
    $("status1").textContent = "Fehler: " + e.message + "\nBitte noch einmal versuchen."; $("status1").classList.add("fehler");
  } finally { LAEUFT = false; $("datei").value = ""; }
};

// ---- Schritt 3: speichern --------------------------------------------------------------------------
$("speichern").onclick = async () => {
  if (!PFAD || !pflichtOk()) return;
  const betrag = Number(String($("betrag").value).replace(",", "."));
  const kmWert = Math.round(Number(String($("km").value).replace(/[.\s]/g, "")));
  if (!isFinite(kmWert) || kmWert <= 0) { $("km").classList.add("fehlt"); $("status2").textContent = "Bitte den Kilometerstand eintragen (Pflicht)."; $("status2").classList.add("fehler"); $("km").focus(); return; }
  if (!$("datum").value || !$("uhrzeit").value || !isFinite(betrag) || betrag <= 0) { $("status2").textContent = "Datum, Uhrzeit und Betrag müssen gefüllt sein."; $("status2").classList.add("fehler"); return; }
  $("speichern").disabled = true; $("status2").classList.remove("fehler"); $("status2").textContent = "Wird gespeichert …";
  const g = GELESEN || {};
  const korrigiert = g.datum !== $("datum").value || (g.uhrzeit || "") !== $("uhrzeit").value || (g.betrag_brutto == null ? -1 : Math.round(g.betrag_brutto * 100)) !== Math.round(betrag * 100);
  try {
    const j = await funktion({ speichern: true, pfad: PFAD, vorname: $("vorname").value.trim(), nachname: $("nachname").value.trim(), kennzeichen: $("kennzeichen").value.trim(),
      km_stand: kmWert, datum: $("datum").value, uhrzeit: $("uhrzeit").value, betrag_brutto: betrag, liter: $("liter").value || null, einheit: $("einheit").value,
      kraftstoff: $("kraftstoff").value.trim() || null, tankstelle: $("tankstelle").value.trim() || null, ki_roh: GELESEN, korrigiert,
      rueckfrage_bestaetigt: RUECKFRAGE_OFFEN, geraet: navigator.userAgent.slice(0, 200) });
    if (j.rueckfrage && j.rueckfrage.length) {
      // Unplausibel: nichts gespeichert. Mitarbeiter korrigiert - oder bestaetigt mit dem zweiten Klick.
      RUECKFRAGE_OFFEN = true;
      $("rueckfrage").innerHTML = `<div class="rueckfrage"><b>Bitte prüfen:</b>${j.rueckfrage.map(esc).join("<br>")}<br><small>Zahl oben korrigieren – oder, wenn alles stimmt, noch einmal auf den Knopf tippen.</small></div>`;
      $("speichern").textContent = "Angaben stimmen – trotzdem speichern"; $("status2").textContent = "";
      $("rueckfrage").scrollIntoView({ behavior: "smooth", block: "center" }); return;
    }
    const seit = j.km_diff != null && j.km_diff > 0 ? `Seit dem letzten Beleg (${deDatum(j.vorher.datum)}): ${km(j.km_diff)}` + (j.verbrauch_100 != null ? ` · ${Number(j.verbrauch_100).toLocaleString("de-DE")} ${j.einheit}/100 km` : "") + (j.kosten_100 != null ? ` · ${Number(j.kosten_100).toLocaleString("de-DE", { minimumFractionDigits: 2 })} €/100 km` : "") : "Erster Beleg mit Kilometerstand für dieses Fahrzeug.";
    $("fertigText").innerHTML = `Gespeichert: ${esc(j.kennzeichen)} · ${deDatum(j.datum)} ${esc(j.uhrzeit)} · ${eur(j.betrag_brutto)} · ${km(j.km_stand)} · ${esc(j.tanker_vorname)} ${esc(j.tanker_nachname)} (Beleg Nr. ${j.id})<small>${esc(seit)}</small>`;
    $("pruefen").classList.add("versteckt"); $("fertig").classList.remove("versteckt"); $("fertig").scrollIntoView({ behavior: "smooth" });
    PFAD = null; GELESEN = null; RUECKFRAGE_OFFEN = false; $("rueckfrage").innerHTML = ""; $("speichern").textContent = "Beleg speichern"; meineBelege();
  } catch (e) { $("status2").textContent = "Fehler: " + e.message; $("status2").classList.add("fehler"); }
  finally { $("speichern").disabled = false; }
};
for (const id of ["km", "liter", "einheit", "datum", "uhrzeit"]) $(id).addEventListener("input", () => { if (RUECKFRAGE_OFFEN) { RUECKFRAGE_OFFEN = false; $("rueckfrage").innerHTML = ""; $("speichern").textContent = "Beleg speichern"; } });
$("naechster").onclick = () => {
  $("fertig").classList.add("versteckt"); $("fotoFeld").classList.remove("hat"); $("vorschau").removeAttribute("src"); $("status1").textContent = "";
  $("fotoBox").scrollIntoView({ behavior: "smooth" });
};

// ---- Eigene Belege ------------------------------------------------------------------------------------
async function meineBelege() {
  const vn = $("vorname").value.trim(), nn = $("nachname").value.trim();
  if (vn.length < 2 || nn.length < 2) return;
  try {
    const j = await funktion({ liste: true, vorname: vn, nachname: nn });
    if (!j.belege.length) { $("liste").textContent = "Noch keine Belege erfasst."; return; }
    $("liste").innerHTML = `<table><tr><th>Datum</th><th>Kennzeichen</th><th style="text-align:right">km-Stand</th><th style="text-align:right">seit letztem</th><th style="text-align:right">Betrag</th></tr>` +
      j.belege.map(b => `<tr><td>${deDatum(b.datum)} ${esc((b.uhrzeit || "").slice(0, 5))}</td><td>${esc(b.kennzeichen)}</td><td class="z">${b.km_stand != null ? km(b.km_stand) : "–"}</td><td class="z">${b.km_diff != null && b.km_diff > 0 ? km(b.km_diff) + (b.verbrauch_100 != null ? `<br><small>${Number(b.verbrauch_100).toLocaleString("de-DE")} ${esc(b.einheit || "l")}/100 km</small>` : "") : "–"}</td><td class="z">${eur(b.betrag_brutto)}</td></tr>`).join("") + `</table>`;
  } catch (e) { $("liste").textContent = "Belege konnten nicht geladen werden: " + e.message; }
}
meineBelege();
</script>
</body>
</html>
